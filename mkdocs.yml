site_name: Xitee's Docs
site_url: https://docs.xitma.de
site_description: Personal documentation site with tutorials and guides about Linux, networking, hardware, Android, media encoding, and more.
site_author: Xitee
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/avatar.jpg
  favicon: assets/images/favicon.png
  features:
    - search.highlight
    - navigation.tabs
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        text: Toggle dark mode

    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        text: Toggle light mode

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/home.py

extra:
  # GitHub repositories shown on the home page, in this order
  projects:
    - Xitee1/ia-gui
    - Xitee1/bd-archiver
    - Xitee1/vhs-tool
    - Xitee1/opening-ending-extractor
    - Xitee1/sleep-timer
    - Xitee1/ha-thermostat-valve-controller
    - Xitee1/ha-amoled-theme
    - Xitee1/AD-RoombaMap
    - luckkyboy/multimedia-knob
    - Xitee1/PowerBoard
    - Xitee1/DeathLocation

# Pages reachable by links only, without a navigation entry
not_in_nav: |
  /minecraft.md

repo_url: https://github.com/Xitee1/xitee-docs
repo_name: Xitee1/xitee-docs

plugins:
  - search
  # Only used to open external links in a new tab (with rel="noopener");
  # external assets are not downloaded
  - privacy:
      assets: false
      links_attr_map:
        target: _blank
  - blog
  - meta
  - awesome-nav
  - glightbox
  - git-revision-date-localized:
      type: timeago
      fallback_to_build_date: false
      enable_creation_date: true
  - redirects:
      redirect_maps:
        'mkdocs-syntax-examples/index.md': 'docs/mkdocs-syntax-examples.md'
        'media/video-encoding/benchmark-with-ffmpeg/index.md': 'docs/media/video-encoding/benchmark-with-ffmpeg.md'

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
        alternate_style: true
  - admonition
  - pymdownx.details
