{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% if page %}
    {% if page.is_homepage %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "{{ config.site_name }}",
      "url": "{{ config.site_url }}",
      "description": "{{ config.site_description }}"
    }
    </script>
    {% elif page.meta and page.meta.date %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "{{ page.title }}",
      "url": "{{ page.canonical_url }}",
      "description": "{{ page.meta.description | default(config.site_description, true) }}",
      "image": "{{ config.site_url }}assets/images/favicon.png",
      "author": {
        "@type": "Person",
        "name": "{{ config.site_author }}",
        "url": "https://github.com/Xitee1"
      },
      "datePublished": "{{ page.meta.date.created }}",
      "dateModified": "{{ page.meta.date.updated | default(page.meta.date.created, true) }}"
    }
    </script>
    {% else %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TechArticle",
      "headline": "{{ page.title }}",
      "url": "{{ page.canonical_url }}",
      "description": "{{ page.meta.description | default(config.site_description, true) }}",
      "image": "{{ config.site_url }}assets/images/favicon.png",
      "author": {
        "@type": "Person",
        "name": "{{ config.site_author }}",
        "url": "https://github.com/Xitee1"
      }
    }
    </script>
    {% endif %}
  {% endif %}
{% endblock %}
